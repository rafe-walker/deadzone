name: deadzone
version: "0.1.0"
slug: deadzone
description: Can I take this video call? Fuses Solar Assistant (power), Starlink (uplink) and Open-Meteo (weather) into a GO/MAYBE/NO verdict with MQTT + HA discovery
url: https://github.com/rafe-walker/deadzone
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
hassio_api: false
homeassistant_api: false
services:
  - mqtt:want
ingress: true
ingress_port: 8099
panel_icon: mdi:video-wireless
panel_title: deadzone
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Status page + /api/state (optional; ingress works without it)
map:
  - type: data
    read_only: false
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  sa_prefix: solar_assistant
  battery_positive_is_charging: true
  starlink_enabled: true
  starlink_addr: 192.168.100.1:9200
  starlink_dish_watts: 60
  forecast_enabled: true
  latitude: 0.0
  longitude: 0.0
  tilt_deg: 30
  azimuth_deg: 0
  array_kwp: 0.0
  battery_kwh: 10.24
  reserve_soc_pct: 20
  parasitic_w: 60
  workstation_watts: 200
  call_length_min: 60
  target_hours: 8
  stale_after_s: 30
  shed: []
  log_level: info
schema:
  mqtt_host: str?
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  sa_prefix: str
  battery_positive_is_charging: bool
  starlink_enabled: bool
  starlink_addr: str
  starlink_dish_watts: float(0,500)
  forecast_enabled: bool
  latitude: float(-90,90)
  longitude: float(-180,180)
  tilt_deg: float(0,90)
  azimuth_deg: float(-180,180)
  array_kwp: float(0,1000)
  battery_kwh: float(0.1,10000)
  reserve_soc_pct: float(0,99)
  parasitic_w: float(0,5000)
  workstation_watts: float(0,5000)
  call_length_min: float(5,600)
  target_hours: float(0.5,168)
  stale_after_s: float(5,600)
  shed:
    - name: str
      watts: float(1,20000)
      priority: int(1,99)?
      control: str?
  log_level: list(debug|info|warn|error)
